<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬로엘 직원 앱</title>
<style>
:root{--bg:#fffbe6;--card:#fffef6;--tx:#4a4130;--mut:#9a8f73;--ac:#f6d365;--acx:#4a4130;--ln:#f3e6a8;--today:#fff0b0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b271a;--card:#383222;--tx:#fdf3cf;--mut:#c2b78f;--ac:#e9c46a;--acx:#2b271a;--ln:#4d452d;--today:#4a4020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b271a;--card:#383222;--tx:#fdf3cf;--mut:#c2b78f;--ac:#e9c46a;--acx:#2b271a;--ln:#4d452d;--today:#4a4020;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;padding-bottom:90px}
header{padding:18px 16px 8px}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
nav{display:flex;gap:8px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:600}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:4px 16px}
.week{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.week b{font-size:16px}
.week button{width:40px;height:36px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font-size:16px}
.day{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.day.today{background:var(--today);border-color:var(--ac)}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.dh small{color:var(--mut);font-weight:500}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--ln);margin-top:6px}
.sh .n{font-weight:600}
.sh .t{color:var(--mut);font-size:13px}
.sh .nt{color:var(--mut);font-size:12.5px}
.x{border:0;background:none;color:var(--mut);font-size:15px;padding:4px 8px}
.empty{color:var(--mut);font-size:13px;margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chips button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 13px;font-size:13.5px}
.chips button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cat{font-size:13px;color:var(--ac);font-weight:700;margin:12px 0 6px}
.mi{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.mi .n{font-weight:700}
.mi .d{color:var(--mut);font-size:13px;margin-top:2px}
.mi .p{font-weight:700;white-space:nowrap;text-align:right}
.mi .ed{display:block;color:var(--mut);font-size:12px;margin-top:6px;border:0;background:none;padding:0;margin-left:auto}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acx);border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.panel h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--mut);margin:9px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.row{display:flex;gap:8px}.row>div{flex:1}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600}
.btns .ok{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.note{background:var(--today);border-radius:10px;padding:8px 10px;font-size:12.5px;margin:6px 0 10px}
.cal{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px;margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ch b{font-size:16px}
.ch button{width:40px;height:34px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;font-size:16px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg .w{font-size:11.5px;color:var(--mut);padding:2px 0}
.cg button.c{border:0;background:none;color:var(--tx);border-radius:12px;padding:5px 0 3px;min-height:46px;font-size:14px}
.c.o{opacity:.35}.c.t{background:var(--today);font-weight:700}.c.s{outline:2px solid var(--ac)}
.c i{display:block;font-style:normal;font-size:10.5px;color:#4a4130;background:#cfe8c4;border-radius:8px;margin:2px 4px 0}
.day,.mi,.cal{box-shadow:0 2px 8px rgba(246,211,101,.25)}
.fab{z-index:3}
select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px;min-height:9px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:middle}
.dot.big{width:16px;height:16px;flex:none}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin:2px 0 8px}
.lg .dot{margin-right:4px}
.at{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--ln)}
.an{flex:1;font-weight:700}.an small{font-weight:500;color:var(--mut)}
.as{font-size:12.5px;color:var(--mut);font-weight:500}
.ab{border:0;background:var(--ac);color:var(--acx);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700}
.ab:disabled{opacity:.45}
nav button{font-size:14px;padding:10px 2px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.gh small{margin-left:auto;color:var(--mut);font-size:12.5px}
.gg{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0 6px}

#splash{position:fixed;inset:0;z-index:100;background:#fdfdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;color-scheme:light}
#splash.out{opacity:0;pointer-events:none}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
var wk=monday(new Date());
var $=function(id){return document.getElementById(id)};
var splashDone=false,splashT=Date.now();
function hideSplash(){if(splashDone)return;splashDone=true;setTimeout(function(){var s=$("splash");if(!s)return;s.className="out";setTimeout(function(){s.remove()},600)},Math.max(0,1800-(Date.now()-splashT)))}
setTimeout(hideSplash,5000);

function render(){
  ["cal","sch","att","menu"].forEach(function(k){$("t-"+k).className=tab===k?"on":""});
  var f=$("fab");f.style.display=tab==="att"?"none":"";
  f.textContent=tab==="menu"?"＋ 메뉴 추가":"＋ 근무 추가";
  var body=tab==="cal"?renderCalTab():tab==="sch"?renderSch():tab==="att"?renderAttTab():renderMenu();
  $("main").innerHTML=(offline?'<div class="note">저장소에 연결되지 않아 이 화면에서만 임시로 보입니다.</div>':"")+body;
}
function shiftRow(s){
  var a=att.find(function(x){return x.id===s.date+"_"+s.name});
  return '<div class="sh"><div><span class="dot" style="background:'+sc(s.name)+'"></span> <span class="n">'+esc(s.name)+'</span> <span class="t">'+esc(s.start)+" – "+esc(s.end)+'</span>'+(a?'<div class="nt">✓ 출근 '+esc(a.inT)+(a.outT?" · 퇴근 "+esc(a.outT):"")+'</div>':"")+(s.note?'<div class="nt">'+esc(s.note)+'</div>':"")+'</div><button class="x" data-a="delshift" data-id="'+esc(s.id)+'">✕</button></div>';
}
function renderCalTab(){
  var p=sel.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  var list=shifts.filter(function(s){return s.date===sel}).sort(function(a,b){return (a.start||"").localeCompare(b.start||"")});
  var h=renderCal()+'<div class="day"><div class="dh"><span>'+(d.getMonth()+1)+"/"+d.getDate()+" ("+DOW[d.getDay()]+')</span><small>'+hrs(sel)[0]+"–"+hrs(sel)[1]+'</small></div>';
  if(!list.length)h+='<div class="empty">등록된 근무가 없어요</div>';
  list.forEach(function(s){h+=shiftRow(s)});
  return h+"</div>";
}
var FARM_START="2026-11-23"; // 새싹 키우기 시작일 (원하는 날짜로 바꾸세요)
var CAN='<svg class="can" viewBox="0 0 100 80"><g class="cg2"><path d="M54 42 L84 20" stroke="#5b6b3f" stroke-width="7" stroke-linecap="round"/><path d="M54 42 L84 20" stroke="#8cc5f2" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="86" cy="19" rx="3.5" ry="7" transform="rotate(35 86 19)" fill="#8cc5f2" stroke="#5b6b3f" stroke-width="1.8"/><path d="M12 36 q-14 2 -10 18 q4 8 14 5" fill="none" stroke="#5b6b3f" stroke-width="2.2" stroke-linecap="round"/><rect x="10" y="28" width="46" height="36" rx="9" fill="#8cc5f2" stroke="#5b6b3f" stroke-width="2.2"/><path d="M18 36 q8 -3 14 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/></g><g fill="#8cc5f2"><circle class="d" cx="88" cy="46" r="2.6"/><circle class="d" cx="93" cy="44" r="2.2" style="animation-delay:.25s"/><circle class="d" cx="90" cy="45" r="2.4" style="animation-delay:.5s"/></g></svg>';
function farmN(){var a=FARM_START.split("-"),s=new Date(+a[0],+a[1]-1,+a[2]),n=new Date();return Math.max(1,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-s)/864e5)+1)}
function sprout(d){
  var h=10+d*3.1,top=100-h,nl=Math.min(8,Math.ceil(d/3));
  var s='<svg class="spr" viewBox="0 0 120 120"><ellipse cx="60" cy="106" rx="44" ry="11" fill="#9c7a54"/><ellipse cx="60" cy="101" rx="36" ry="8" fill="#7d5f3f"/><path d="M60 102 Q56 '+(100-h/2)+' 60 '+top+'" stroke="#6fbf73" stroke-width="5" fill="none" stroke-linecap="round"/>';
  function lf(cx,cy,rx,rot){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+rx*.5+'" transform="rotate('+rot+' '+cx+' '+cy+')" fill="#8fd19e" stroke="#5d9a66" stroke-width="1.2"/>'}
  for(var k=0;k<nl;k++){var y=100-(k+1)*h/(nl+1)*.95-4,sd=k%2?1:-1,sz=6+Math.min(k+1,5)*1.6+d*.12;s+=lf(60+sd*(sz+3),y,sz,sd*-25)}
  if(d>=20){for(var a=0;a<5;a++){var an=a*1.2566;s+='<circle cx="'+(60+Math.sin(an)*10)+'" cy="'+(top-Math.cos(an)*10)+'" r="7" fill="#ffd6e0" stroke="#e7a1b6" stroke-width="1"/>'}s+='<circle cx="60" cy="'+top+'" r="6" fill="#f6d365"/>'}
  else{var t=5+d*.25;s+=lf(60-t-1,top-1,t,-35)+lf(60+t+1,top-1,t,35)}
  return s+"</svg>";
}
function renderFarm(p){
  var n=farmN(),d=((n-1)%20)+1;
  return '<div class="cal"><div class="gh"><span class="dot big" style="background:'+p.c+'"></span><b>'+p.n+'</b><small>'+p.r+' · '+n+'일째 🌱</small></div><div class="farm">'+CAN+sprout(d)+'</div><div class="as" style="text-align:center">매일 자동 출석 ✓ · '+(d===20?"🌼 꽃이 활짝 폈어요!":"꽃까지 "+d+"/20")+'</div></div>';
}
function renderGrapes(p){
  var total=att.filter(function(a){return a.name===p.n&&a.inT}).length,N=20;
  var filled=total?((total-1)%N)+1:0,boards=total?Math.floor((total-1)/N)+1:1;
  var h='<div class="cal gb"><div class="gh"><span class="dot big" style="background:'+p.c+'"></span><b>'+p.n+'</b><small>'+(total?boards+"번째 송이 · ":"")+filled+"/"+N+(filled===N?" 🎉 완성!":"")+'</small></div><div class="gg">';
  h+='<svg class="br" viewBox="0 0 300 64"><path d="M6 24 Q70 6 150 22 T294 12" stroke="#9c7a54" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M62 15 q-4 -10 -14 -13" stroke="#9c7a54" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M150 22 V58" stroke="#8a6a46" stroke-width="6" stroke-linecap="round"/><path d="M152 30 q16 -2 16 10 q-2 8 -10 4" stroke="#7fc58a" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="38" cy="9" rx="13" ry="6.5" transform="rotate(-28 38 9)" fill="#9fd18b" stroke="#5d9a66" stroke-width="1.4"/><ellipse cx="236" cy="6" rx="13" ry="6.5" transform="rotate(22 236 6)" fill="#9fd18b" stroke="#5d9a66" stroke-width="1.4"/><path d="M104 20 q-6 20 -26 18 q4 -18 26 -18z" fill="#8fd19e" stroke="#5d9a66" stroke-width="1.4" stroke-linejoin="round"/><path d="M196 22 q8 20 28 16 q-6 -18 -28 -16z" fill="#8fd19e" stroke="#5d9a66" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  var idx=0;
  [6,5,4,3,2].forEach(function(c){
    h+='<div class="gr">';
    for(var j=0;j<c;j++){idx++;h+=idx<=filled?'<span class="g on" style="--gc:'+p.c+'"></span>':'<span class="g">'+idx+'</span>'}
    h+="</div>";
  });
  return h+"</div></div>";
}
function renderAttTab(){var h=renderAtt();STAFF.forEach(function(p){h+=p.boss?renderFarm(p):renderGrapes(p)});return h}

function renderCal(){
  var y=cm.getFullYear(),m=cm.getMonth(),start=new Date(y,m,1-((new Date(y,m,1).getDay()+6)%7)),today=ymd(new Date()),cnt={};
  shifts.forEach(function(s){(cnt[s.date]=cnt[s.date]||[]).push(s.name)});
  var h='<div class="cal"><div class="ch"><button data-a="cprev">‹</button><b>'+y+"년 "+(m+1)+'월</b><button data-a="cnext">›</button></div><div class="lg">'+STAFF.map(function(p){return '<span><span class="dot" style="background:'+p.c+'"></span>'+p.n+"</span>"}).join("")+'</div><div class="cg">'+["월","화","수","목","금","토","일"].map(function(w){return '<div class="w">'+w+"</div>"}).join("");
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    if(i>=35&&d.getMonth()!==m)break;
    var k=ymd(d);
    h+='<button class="c'+(d.getMonth()!==m?" o":"")+(k===today?" t":"")+(k===sel?" s":"")+'" data-a="cday" data-d="'+k+'">'+d.getDate()+dots(cnt[k])+"</button>";
  }
  return h+"</div></div>";
}

function renderSch(){
  var h="",end=new Date(wk);end.setDate(end.getDate()+6);
  h+='<div class="week"><button data-a="prev">‹</button><b>'+(wk.getMonth()+1)+"월 "+wk.getDate()+"일 – "+(end.getMonth()+1)+"월 "+end.getDate()+'일</b><button data-a="next">›</button></div>';
  var today=ymd(new Date());
  for(var i=0;i<7;i++){
    var d=new Date(wk);d.setDate(d.getDate()+i);var k=ymd(d);
    var list=shifts.filter(function(s){return s.date===k}).sort(function(a,b){return (a.start||"").localeCompare(b.start||"")});
    h+='<div class="day'+(k===today?" today":"")+'"><div class="dh"><span>'+(d.getMonth()+1)+"/"+d.getDate()+" ("+DOW[d.getDay()]+')</span><small>'+list.length+'명 · '+hrs(k)[0]+"–"+hrs(k)[1]+'</small></div>';
    if(!list.length)h+='<div class="empty">등록된 근무가 없어요</div>';
    list.forEach(function(s){
      var a=att.find(function(x){return x.id===s.date+"_"+s.name});
      h+='<div class="sh"><div><span class="dot" style="background:'+sc(s.name)+'"></span> <span class="n">'+esc(s.name)+'</span> <span class="t">'+esc(s.start)+" – "+esc(s.end)+'</span>'+(a?'<div class="nt">✓ 출근 '+esc(a.inT)+(a.outT?" · 퇴근 "+esc(a.outT):"")+'</div>':"")+(s.note?'<div class="nt">'+esc(s.note)+'</div>':"")+'</div><button class="x" data-a="delshift" data-id="'+esc(s.id)+'">✕</button></div>';
    });
    h+="</div>";
  }
  return h;
}

function renderMenu(){
  var cats=["전체"];
  menu.forEach(function(m){if(m.category&&cats.indexOf(m.category)<0)cats.push(m.category)});
  if(cats.indexOf(cat)<0)cat="전체";
  var h='<div class="chips">'+cats.map(function(c){return '<button class="'+(c===cat?"on":"")+'" data-a="cat" data-c="'+esc(c)+'">'+esc(c)+"</button>"}).join("")+"</div>";
  var items=menu.filter(function(m){return cat==="전체"||m.category===cat});
  if(!items.length)return h+'<div class="empty">아직 등록된 메뉴가 없어요. 아래 버튼으로 추가해 주세요.</div>';
  var groups={};items.forEach(function(m){var c=m.category||"기타";(groups[c]=groups[c]||[]).push(m)});
  Object.keys(groups).forEach(function(c){
    h+='<div class="cat">'+esc(c)+"</div>";
    groups[c].forEach(function(m){
      h+='<div class="mi"><div><div class="n">'+esc(m.name)+'</div>'+(m.desc?'<div class="d">'+esc(m.desc)+"</div>":"")+'</div><div class="p">'+(m.price!=null&&m.price!==""?Number(m.price).toLocaleString("ko-KR")+"원":"")+'<button class="ed" data-a="editmenu" data-id="'+esc(m.id)+'">수정</button></div></div>';
    });
  });
  return h;
}

function openSheet(html){$("panel").innerHTML=html;$("sheet").className="sheet open"}
function closeSheet(){$("sheet").className="sheet"}

function shiftForm(){
  openSheet('<h2>근무 추가</h2><label>날짜</label><input type="date" id="f-date" value="'+sel+'"><label>이름</label><select id="f-name">'+STAFF.map(function(p){return "<option>"+p.n+"</option>"}).join("")+'</select><div class="row"><div><label>시작</label><input type="time" id="f-start" value="'+hrs(sel)[0]+'"></div><div><label>종료</label><input type="time" id="f-end" value="'+hrs(sel)[1]+'"></div></div><label>메모 (선택)</label><input id="f-note" placeholder="예: 오픈, 마감"><div class="btns"><button data-a="close">취소</button><button class="ok" data-a="saveshift">저장</button></div>');
}
function menuForm(m){
  m=m||{};
  var cats=[];menu.forEach(function(x){if(x.category&&cats.indexOf(x.category)<0)cats.push(x.category)});
  openSheet('<h2>'+(m.id?"메뉴 수정":"메뉴 추가")+'</h2><label>카테고리</label><input id="m-cat" list="cats" value="'+esc(m.category)+'" placeholder="예: 커피, 디저트"><datalist id="cats">'+cats.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist><label>메뉴 이름</label><input id="m-name" value="'+esc(m.name)+'"><label>가격 (원)</label><input type="number" inputmode="numeric" id="m-price" value="'+esc(m.price)+'"><label>설명 (선택)</label><textarea id="m-desc" rows="2">'+esc(m.desc)+'</textarea><div class="btns">'+(m.id?'<button data-a="delmenu" data-id="'+esc(m.id)+'">삭제</button>':'<button data-a="close">취소</button>')+'<button class="ok" data-a="savemenu" data-id="'+esc(m.id||"")+'">저장</button></div>');
}

async function put(col,id,data){
  if(db){
    try{ if(id)await db.collection(col).doc(id).set(data); else await db.collection(col).add(data); return; }catch(e){offline=true}
  }
  var arr=col==="shifts"?shifts:col==="menu"?menu:att;
  var row=Object.assign({id:id||("l"+Date.now())},data);
  var i=arr.findIndex(function(x){return x.id===row.id});
  if(i>=0)arr[i]=row;else arr.push(row);
  render();
}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete();return}catch(e){offline=true}}
  var arr=col==="shifts"?shifts:col==="menu"?menu:att;
  var i=arr.findIndex(function(x){return x.id===id});if(i>=0)arr.splice(i,1);render();
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id&&t.id.indexOf("t-")===0){tab=t.id.slice(2);render();return}
  if(t.id==="fab"){tab==="sch"?shiftForm():menuForm();return}
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a==="prev"){wk.setDate(wk.getDate()-7);render()}
  else if(a==="next"){wk.setDate(wk.getDate()+7);render()}
  else if(a==="cat"){cat=t.getAttribute("data-c");render()}
  else if(a==="att"){
    var nm=t.getAttribute("data-n"),td=ymd(new Date()),rid=td+"_"+nm,rr=att.find(function(x){return x.id===rid});
    if(rr&&rr.outT)return;
    if(!confirm(nm+"님 본인이 맞나요? "+(rr?"퇴근":"출근")+" 처리합니다."))return;
    put("attendance",rid,{date:td,name:nm,inT:rr?rr.inT:hhmm(),outT:rr?hhmm():""});
  }
  else if(a==="cprev"){cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);render()}
  else if(a==="cnext"){cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);render()}
  else if(a==="cday"){sel=t.getAttribute("data-d");var p=sel.split("-");wk=monday(new Date(+p[0],+p[1]-1,+p[2]));render()}
  else if(a==="close")closeSheet();
  else if(a==="delshift"){if(confirm("이 근무를 삭제할까요?"))del("shifts",id)}
  else if(a==="editmenu")menuForm(menu.find(function(x){return x.id===id}));
  else if(a==="delmenu"){if(confirm("이 메뉴를 삭제할까요?")){del("menu",id);closeSheet()}}
  else if(a==="saveshift"){
    var n=$("f-name").value.trim();if(!n||!$("f-date").value){alert("날짜와 이름을 입력해 주세요");return}
    put("shifts",null,{date:$("f-date").value,name:n,start:$("f-start").value,end:$("f-end").value,note:$("f-note").value.trim()});closeSheet();
  }
  else if(a==="savemenu"){
    var mn=$("m-name").value.trim();if(!mn){alert("메뉴 이름을 입력해 주세요");return}
    put("menu",id||null,{category:$("m-cat").value.trim()||"기타",name:mn,price:$("m-price").value===""?"":Number($("m-price").value),desc:$("m-desc").value.trim()});closeSheet();
  }
});
document.addEventListener("change",function(e){if(e.target.id==="f-date"&&e.target.value){var h=hrs(e.target.value);$("f-start").value=h[0];$("f-end").value=h[1]}});
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet()});
