<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안서김전</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf3ff;--card:#fff;--tx:#2f4270;--mut:#7f93bb;--ln:#d6e5fb;--pk:#8ab8ff;--mt:#7fd6ea;--yl:#b5a8ff;--ac:#3f7be0;--on:#1f3563;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161f33;--card:#202c47;--tx:#e8f0ff;--mut:#9fb2d8;--ln:#2f3f63;--ac:#8fb8ff}}
:root[data-theme="dark"]{--bg:#161f33;--card:#202c47;--tx:#e8f0ff;--mut:#9fb2d8;--ln:#2f3f63;--ac:#8fb8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;font-synthesis:none}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:12px 18px 4px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:26px;font-weight:400;color:var(--ac);letter-spacing:.02em}
header span{font-size:13px;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:8px 14px 18px}
nav{display:flex;gap:8px;padding:6px 14px 8px}
nav button{flex:1;border:0;background:var(--card);border-radius:16px;padding:7px 4px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{background:var(--c);color:var(--on)}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mh b{flex:1;text-align:center;font-size:20px;font-weight:400}
.mh button{border:0;background:var(--card);border-radius:12px;width:38px;height:38px;font-size:22px;line-height:1;box-shadow:0 1px 0 var(--ln)}
.mh .tdy{width:auto;padding:0 12px;font-size:14px;color:var(--ac)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);padding:10px 8px;border-radius:20px}
.dw{text-align:center;font-size:13px;color:var(--mut);padding-bottom:4px}
.sa,.dw.sa{color:#5b8def}.su,.dw.su{color:#f0617f}
.d{border:0;background:none;aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;padding:0}
.d.td{box-shadow:inset 0 0 0 2px var(--pk)}
.d.sel{background:var(--pk);color:var(--on);box-shadow:none}
.dots{display:flex;gap:2px;height:5px}.dots u{width:5px;height:5px;border-radius:50%;background:var(--pk)}.d.sel .dots u{background:var(--on)}
.day{margin-top:14px;background:var(--card);border-radius:20px;padding:14px}
.day h2,.ls h2{margin:0 0 10px;font-size:18px;font-weight:400}
.add{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.add input{flex:1;min-width:0;border:2px solid var(--ln);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
.add input:focus-visible{border-color:var(--c,var(--pk))}
.add input[type=time]{flex:0 0 112px}
.add button{border:0;border-radius:12px;background:var(--c,var(--pk));color:var(--on);padding:0 16px;min-height:42px}
.add button:focus-visible,.x:focus-visible,.ck:focus-visible,nav button:focus-visible,.d:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:9px 10px}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}li small{display:block;color:var(--mut);font-size:13px}
li time{font-size:13px;color:var(--ac);min-width:44px}
.x{border:0;background:none;color:var(--mut);font-size:22px;width:32px;height:32px;line-height:1}
.ck{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--c);background:none;color:transparent;font-size:15px;padding:0}
li.dn .ck{background:var(--c);color:var(--on)}li.dn .t{text-decoration:line-through;color:var(--mut)}
.em{text-align:center;color:var(--mut);padding:14px 0 6px;font-size:14px}
.ls{background:var(--card);border-radius:20px;padding:14px}
.ls .sub{color:var(--mut);font-size:13px;margin:-6px 0 10px}
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(#d4e8ff,#f1f7ff);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;color:#4b4468;color-scheme:light}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(86vw,340px);height:auto;overflow:visible}
#splash h2{margin:6px 0 0;font-size:30px;font-weight:400;color:#3f7be0}
.pb{transform-box:fill-box;transform-origin:50% 100%;animation:jp 1.1s ease-in-out infinite}
@keyframes jp{0%,100%{transform:scale(1.07,.9)}35%{transform:translateY(-18px) scale(.95,1.07)}65%{transform:translateY(0) scale(1.07,.9)}}
.an{transform-box:fill-box;transform-origin:50% 100%;animation:wb .5s ease-in-out infinite alternate}
@keyframes wb{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hd{animation:wv .5s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateY(2px)}to{transform:translateY(-9px)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sn 6s linear infinite}@keyframes sn{to{transform:rotate(360deg)}}
.cl2{animation:cd 5s ease-in-out infinite alternate}@keyframes cd{to{transform:translateX(14px)}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="splash" aria-label="불러오는 중">
<svg viewBox="0 0 260 200" aria-hidden="true"><g class="sun"><circle cx="218" cy="36" r="17" fill="#ffe9a8"/><path d="M218 8v-6M218 64v6M190 36h-6M246 36h6M198 16l-4-4M238 56l4 4M238 16l4-4M198 56l-4 4" stroke="#ffd36e" stroke-width="3" stroke-linecap="round"/></g><g class="cl2" fill="#fff"><ellipse cx="46" cy="34" rx="22" ry="9"/><ellipse cx="62" cy="28" rx="14" ry="9"/></g><ellipse cx="130" cy="196" rx="190" ry="58" fill="#c8eed6"/><g id="pals"></g></svg>
<h2>안서김전</h2>
</div>
<div id="app"><header><h1>안서김전</h1><span id="hd"></span></header><nav id="nv"></nav><main id="mn"></main></div>
<script>
(function(){
var C=["#9cc8ff","#8fe0f0","#c3b5ff","#a9bcff"],X=[42,100,158,216],O="#4a5f94";
var A=['<circle cx="0" cy="-77" r="7" fill="#fff" stroke="'+O+'" stroke-width="2"/>','<path d="M0 -69C-12 -79 -4 -89 0 -81C4 -89 12 -79 0 -69Z" fill="#ff9fb7" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/>','<path d="M0 -90l3 7 7.5 .8-5.6 5 1.7 7.4-6.6-3.9-6.6 3.9 1.7-7.4-5.6-5 7.5-.8z" fill="#ffe48a" stroke="'+O+'" stroke-width="1.8" stroke-linejoin="round"/>','<path d="M0 -90C-8 -79 -7 -69 0 -69C7 -69 8 -79 0 -90Z" fill="#8fe0f0" stroke="'+O+'" stroke-width="2"/>'];
var h="";
for(var i=0;i<4;i++){
  h+='<g transform="translate('+X[i]+' 156)"><g class="pb" style="animation-delay:'+(i*.18)+'s"><g stroke="'+O+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="-9" cy="-1" rx="9" ry="5" fill="'+C[i]+'"/><ellipse cx="9" cy="-1" rx="9" ry="5" fill="'+C[i]+'"/><ellipse cx="0" cy="-30" rx="22" ry="28" fill="'+C[i]+'"/>'
   +'<g class="an"><path d="M0 -57V-69" fill="none"/>'+A[i]+'</g></g>'
   +'<ellipse cx="0" cy="-22" rx="11" ry="12" fill="#fff" opacity=".45"/><circle cx="-8" cy="-40" r="2.6" fill="#2f4270"/><circle cx="8" cy="-40" r="2.6" fill="#2f4270"/><path d="M-5 -33q5 5 10 0" stroke="#2f4270" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="-14" cy="-34" r="3.5" fill="#ff9fb7" opacity=".6"/><circle cx="14" cy="-34" r="3.5" fill="#ff9fb7" opacity=".6"/>'
   +'<circle class="hd" style="animation-delay:'+(i*.12)+'s" cx="-25" cy="-28" r="5.5" fill="'+C[i]+'" stroke="'+O+'" stroke-width="2.2"/><circle class="hd" style="animation-delay:'+(i*.12+.25)+'s" cx="25" cy="-28" r="5.5" fill="'+C[i]+'" stroke="'+O+'" stroke-width="2.2"/></g></g>';
}
document.getElementById("pals").innerHTML=h;
setTimeout(function(){var s=document.getElementById("splash");s.className="out";setTimeout(function(){s.remove()},600)},3400);
})();
var $=function(s){return document.querySelector(s)};
var S={ev:[],pl:[],wi:[]};
try{var raw=localStorage.getItem("ansgj1");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("ansgj1",JSON.stringify(S))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var DW=["월","화","수","목","금","토","일"];
var TABS=[["cal","📅","일정","--pk"],["pl","📍","가고싶은 곳","--mt"],["wi","✨","하고 싶은거","--yl"]];
var tab="cal",now=new Date(),cm=new Date(now.getFullYear(),now.getMonth(),1),sel=ymd(now);
function cal(){
  var y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),td=ymd(new Date());
  var h='<div class="mh"><button data-a="prev" aria-label="이전 달">‹</button><b>'+y+'년 '+(m+1)+'월</b><button class="tdy" data-a="today">오늘</button><button data-a="next" aria-label="다음 달">›</button></div><div class="g7">';
  DW.forEach(function(w,i){h+='<span class="dw'+(i==5?" sa":i==6?" su":"")+'">'+w+'</span>'});
  for(var i=0;i<off;i++)h+="<span></span>";
  for(var d=1;d<=dim;d++){
    var ds=ymd(new Date(y,m,d)),n=S.ev.filter(function(e){return e.date===ds}).length,c=(off+d-1)%7,dots="";
    for(var j=0;j<Math.min(n,3);j++)dots+="<u></u>";
    h+='<button class="d'+(ds===td?" td":"")+(ds===sel?" sel":"")+(c==5?" sa":c==6?" su":"")+'" data-a="day" data-d="'+ds+'">'+d+'<i class="dots">'+dots+'</i></button>';
  }
  h+="</div>";
  var p=sel.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]);
  var ev=S.ev.filter(function(e){return e.date===sel}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"")});
  h+='<div class="day"><h2>'+(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+DW[(dt.getDay()+6)%7]+')</h2>'+(can?'<div class="add"><input id="e-t" placeholder="일정을 적어 주세요" maxlength="60"><input id="e-h" type="time" aria-label="시간"><button data-a="addev">추가</button></div>':'<div class="em">보기만 할 수 있어요 · 편집 권한이 필요해요</div>');
  h+=ev.length?"<ul>"+ev.map(function(e){return '<li><time>'+(e.time||"하루 종일")+'</time><span class="t">'+esc(e.title)+'</span>'+(can?'<button class="x" data-a="delev" data-id="'+e.id+'" aria-label="삭제">×</button>':"")+'</li>'}).join("")+"</ul>":'<div class="em">이 날은 비어 있어요. 일정을 추가해 보세요</div>';
  return h+"</div>";
}
var LB={pl:["가고싶은 곳","가 보고 싶은 곳 이름","메모(선택)","가 봤어요","아직 없어요. 가고 싶은 곳을 적어 보세요"],wi:["하고 싶은거","하고 싶은 일","","했어요","아직 없어요. 하고 싶은 걸 적어 보세요"]};
function list(kd){
  var L=LB[kd],it=S[kd],dn=it.filter(function(x){return x.done}).length;
  var h='<div class="ls"><h2>'+L[0]+'</h2><div class="sub">'+L[3]+' '+dn+' / '+it.length+'</div>'+(can?'<div class="add"><input id="l-t" placeholder="'+L[1]+'" maxlength="60">'+(L[2]?'<input id="l-m" placeholder="'+L[2]+'" maxlength="80">':"")+'<button data-a="addit">추가</button></div>':'<div class="em">보기만 할 수 있어요</div>');
  h+=it.length?"<ul>"+it.map(function(x){return '<li class="'+(x.done?"dn":"")+'"><button class="ck" data-a="tg" data-id="'+x.id+'" aria-label="'+L[3]+'">✓</button><span class="t">'+esc(x.t)+(x.m?"<small>"+esc(x.m)+"</small>":"")+'</span><button class="x" data-a="delit" data-id="'+x.id+'" aria-label="삭제">×</button></li>'}).join("")+"</ul>":'<div class="em">'+L[4]+'</div>';
  return h+"</div>";
}
function render0(){
  var c=TABS.filter(function(t){return t[0]===tab})[0];
  $("#mn").innerHTML=tab==="cal"?cal():list(tab);
  $("#mn").style.setProperty("--c","var("+c[3]+")");
  $("#nv").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?"on":"")+'" style="--c:var('+t[3]+')" data-a="tab" data-t="'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join("");
}
function render(){var ae=document.activeElement,aid=ae&&ae.id,av=ae&&ae.value,sc=$("#mn").scrollTop;render0();$("#mn").scrollTop=sc;if(aid&&aid!=="mn"){var n=document.getElementById(aid);if(n&&n.tagName==="INPUT"){n.value=av;n.focus()}}}
function focusIn(id){var e=$(id);if(e)e.focus()}
var DBH=null,can=true;
function werr(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){can=false;hd("⚠️ 저장 권한 없음");render()}}
function put(k,o){if(!can)return;if(DBH){DBH.collection(k).doc(o.id).set(o).catch(werr)}else{S[k].push(o);save();render()}}
function rm(k,id){if(!can)return;if(DBH){DBH.collection(k).doc(id).delete().catch(werr)}else{S[k]=S[k].filter(function(x){return x.id!==id});save();render()}}
function upd(k,id,p){if(!can)return;if(DBH){DBH.collection(k).doc(id).update(p).catch(werr)}else{S[k].forEach(function(x){if(x.id===id)Object.assign(x,p)});save();render()}}
function hd(t){var h=$("#hd");if(h)h.textContent=t}
var FIREBASE_CONFIG={apiKey:"AIzaSyCdOCd0iH60PYrdlt_nZO-mt6s0mKe_xhA",authDomain:"slowel-12bfb.firebaseapp.com",projectId:"slowel-12bfb",storageBucket:"slowel-12bfb.firebasestorage.app",messagingSenderId:"159868253598",appId:"1:159868253598:web:7d301662a2a5204e30528f"};
(function(){
  hd("이 폰에만 저장");
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    var fs=firebase.firestore();
    DBH={collection:function(k){return fs.collection("ansgj_"+k)}};
    hd("👥 같이 쓰는 중");
    var tm=setTimeout(function(){hd("연결 중…")},10000);
    ["ev","pl","wi"].forEach(function(k){
      DBH.collection(k).onSnapshot(function(sn){
        clearTimeout(tm);if(can)hd("👥 같이 쓰는 중");
        S[k]=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(x,y){return (x.ts||0)-(y.ts||0)});
        render();
      },function(e){clearTimeout(tm);if(e&&e.code==="permission-denied"){can=false;hd("⚠️ 저장 권한 없음");render()}else{DBH=null;hd("이 폰에만 저장")}});
    });
  }catch(e){DBH=null;hd("이 폰에만 저장")}
})();
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a==="tab"){tab=t.getAttribute("data-t");render();$("#mn").scrollTop=0}
  else if(a==="prev"){cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);render()}
  else if(a==="next"){cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);render()}
  else if(a==="today"){var n=new Date();cm=new Date(n.getFullYear(),n.getMonth(),1);sel=ymd(n);render()}
  else if(a==="day"){sel=t.getAttribute("data-d");render();$("#e-t").scrollIntoView({block:"nearest"})}
  else if(a==="addev"){var v=$("#e-t").value.trim();if(!v){focusIn("#e-t");return}$("#e-t").value="";put("ev",{id:uid(),date:sel,title:v,time:$("#e-h").value});focusIn("#e-t")}
  else if(a==="delev"){rm("ev",id)}
  else if(a==="addit"){var tv=$("#l-t").value.trim();if(!tv){focusIn("#l-t");return}var mm=$("#l-m"),mv=mm?mm.value.trim():"";$("#l-t").value="";if(mm)mm.value="";put(tab,{id:uid(),t:tv,m:mv,done:false,ts:Date.now()});focusIn("#l-t")}
  else if(a==="tg"){var cur=S[tab].filter(function(x){return x.id===id})[0];if(cur)upd(tab,id,{done:!cur.done})}
  else if(a==="delit"){rm(tab,id)}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;
  var b=document.querySelector(".add button");if(b)b.click();
});
render();
</script>
</body>
</html>
